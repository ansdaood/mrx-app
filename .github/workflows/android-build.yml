name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install frontend dependencies
      run: npm ci
      working-directory: .

    - name: Build web assets
      # replace with your actual build script (npm run build / ionic build / yarn build)
      run: npm run build
      working-directory: .

    - name: Capacitor sync (copy assets to android)
      # If you use Capacitor, copy the built web assets into the Android project
      run: |
        npx cap sync android
      working-directory: .
      # If you don't use Capacitor, replace this step with a copy command:
      # run: cp -r dist/* android/app/src/main/assets/public/

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      # If gradlew lives in the android/ folder, do: working-directory: android
      run: ./gradlew assembleDebug --no-daemon --stacktrace
      # optional: add --info if you need more logs

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: mrx-app-debug-apk
        path: app/build/outputs/apk/debug/*.apk
